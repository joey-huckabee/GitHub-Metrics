name: SonarCloud

# Static analysis and coverage reporting, kept separate from ci.yml for the
# same reason codeql.yml is: it needs a credential and a third-party service,
# so a failure here means something different from a failing test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.3.4"

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    # A pull request from a fork cannot read repository secrets, so the scan
    # would fail for a reason the contributor cannot fix. Skip it there; the
    # push to main after merge covers the code.
    #
    # The same is true of Dependabot pull requests, which GitHub also runs
    # without repository secrets. Their SonarCloud check therefore takes the
    # documented skip path below and reports **success without scanning** - so
    # a green tick on a Dependabot PR is not evidence that a bumped action
    # works. Verify such a bump on the push to main. This is the same
    # "a check that cannot fail" shape that the coverage-path guard and the
    # quality-gate read below exist to prevent.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar reads blame to decide what counts as new code, and a shallow
          # clone has none - every line looks new, and the new-code quality
          # gate becomes meaningless.
          fetch-depth: 0

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: poetry

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      # Coverage is produced here rather than downloaded from ci.yml: artifacts
      # do not cross workflows without a second API call, and the run is a few
      # seconds. Integration tests stay deselected, as everywhere else.
      - name: pytest with coverage
        run: poetry run pytest -m "not integration"

      - name: Confirm the coverage report is resolvable
        run: |
          test -f coverage.xml
          # The paths Sonar will try to resolve. If these are bare file names
          # rather than package-qualified ones, coverage silently reports 0%.
          if ! grep -q 'filename="github_metrics/' coverage.xml; then
            echo "::error::coverage.xml paths are not repository-relative;" \
                 "check relative_files and --cov=. in pyproject.toml"
            exit 1
          fi

      # All three, not just the token. The scanner authenticates with the token
      # but reports into the project the other two name, and a missing key
      # fails with an authorization error that mentions neither.
      - name: Is the scan configured?
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          missing=""
          [ -n "$SONAR_TOKEN" ] || missing="$missing SONAR_TOKEN"
          [ -n "$SONAR_ORGANIZATION" ] || missing="$missing SONAR_ORGANIZATION"
          [ -n "$SONAR_PROJECT_KEY" ] || missing="$missing SONAR_PROJECT_KEY"
          if [ -z "$missing" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud scan
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # Passed here rather than written into sonar-project.properties, so
          # the repository carries no value that has to be kept in step with
          # an account.
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      # The scan uploads a report and returns; it does not wait to hear what
      # came of it, so without this the job is green whatever Sonar found -
      # a check that cannot fail, which is the defect `make mutants` exists to
      # catch in the test suite, in CI configuration instead of tests.
      #
      # Done here rather than with sonarqube-quality-gate-action because that
      # action exits 22 on any HTTP error, so a token without permission to
      # read the gate fails the build in a way indistinguishable from a gate
      # that genuinely failed. Which endpoints a token may read depends on how
      # it was issued: a *project analysis* token can submit an analysis and
      # search issues but cannot read `api/qualitygates` or `api/measures`,
      # while a *user* token can read all three. Both are legitimate; the
      # build must not turn red over the difference, and must not go quiet
      # about it either.
      - name: Quality gate and findings
        if: always() && steps.token.outputs.present == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT: ${{ secrets.SONAR_PROJECT_KEY }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          # Every call records its HTTP status next to its body, so a missing
          # section in the summary says "not permitted" rather than nothing.
          fetch() {
            local name="$1" url="$2"
            local code
            code=$(curl -sS -u "$SONAR_TOKEN:" -o "$name.json" -w "%{http_code}" "$url" || echo 000)
            echo "$code" > "$name.status"
            echo "  $name -> HTTP $code"
          }

          # Every read has to name what was analysed. Without a branch or
          # pull-request parameter these endpoints answer about the project's
          # *default* branch on SonarCloud, which need not be this one and may
          # never have been analysed - and an unanalysed branch answers 200
          # with nothing, which reads exactly like a clean project. That is how
          # a main-branch run reported "Quality gate: NONE" and zero issues for
          # a scan that had just succeeded.
          if [ -n "$PR" ]; then
            scope="&pullRequest=$PR"
          else
            scope="&branch=$BRANCH"
          fi
          # The second list is the state of the branch being merged into, so
          # a clean pull request against a codebase carrying issues still
          # reports them. On a push the two scopes are the same branch.
          broad="&branch=$BASE"
          echo "Reading results for scope: ${scope#&} (codebase: $BASE)"
          base="https://sonarcloud.io/api"

          # The scan uploads a report and returns; the server processes it
          # afterwards. Asking for results before that finishes gets a 200
          # carrying nothing - which is how the first main-branch run reported
          # "Quality gate: NONE" and no measures for an analysis that was
          # entirely successful. Wait for the task the scan actually queued.
          task_id=$(sed -n 's/^ceTaskId=//p' .scannerwork/report-task.txt 2>/dev/null || true)
          if [ -n "$task_id" ]; then
            echo "Waiting for analysis $task_id to be processed:"
            for _ in $(seq 1 60); do
              state=$(curl -sS -u "$SONAR_TOKEN:" "$base/ce/task?id=$task_id"                       | python3 -c 'import json,sys; print(json.load(sys.stdin).get("task",{}).get("status",""))'                       2>/dev/null || echo "")
              echo "  $state"
              case "$state" in
                SUCCESS) break ;;
                FAILED|CANCELED)
                  echo "::error title=SonarCloud::Report processing $state."
                  exit 1
                  ;;
              esac
              sleep 5
            done
          else
            echo "No ceTaskId in .scannerwork/report-task.txt; reading results immediately."
          fi

          echo "Reading SonarCloud:"
          fetch issues "$base/issues/search?componentKeys=$PROJECT$scope&resolved=false&ps=200"
          fetch all-issues "$base/issues/search?componentKeys=$PROJECT$broad&resolved=false&ps=200"
          # Scoped like the issues call. Without it this asks about the
          # main branch, which on a pull request is not what was measured
          # and may not have been analysed at all.
          fetch measures "$base/measures/component?component=$PROJECT$scope&metricKeys=coverage,ncloc,duplicated_lines_density,security_hotspots,tests"
          fetch gate "$base/qualitygates/project_status?projectKey=$PROJECT$scope"

          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib


          def read(name: str) -> tuple[str, dict]:
              """Return one call's HTTP status and parsed body."""
              status = pathlib.Path(f"{name}.status").read_text(encoding="utf-8").strip()
              try:
                  return status, json.loads(pathlib.Path(f"{name}.json").read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return status, {}


          def unreadable(status: str, what: str) -> None:
              print(
                  f"## {what}: not available (HTTP {status})\n\n"
                  "The token cannot read this endpoint. A project analysis token "
                  "submits analyses and searches issues; reading the gate and the "
                  "measures needs a user token.\n"
              )


          status, body = read("measures")
          measures = body.get("component", {}).get("measures", [])
          if measures:
              print("## Measures\n")
              for measure in sorted(measures, key=lambda item: item["metric"]):
                  print(f"- `{measure['metric']}`: {measure.get('value', '-')}")
              print()
          else:
              unreadable(status, "Measures")
              if status == "200":
                  # A 200 that carried no measures is the one outcome the
                  # status code cannot explain, so show what did come back.
                  print(f"Body was: `{json.dumps(body)[:400]}`")
                  print()

          for title, name in (("this change", "issues"), ("the codebase", "all-issues")):
              status, body = read(name)
              if "issues" not in body:
                  unreadable(status, f"Issues, {title}")
                  continue
              found = body["issues"]
              print(f"## Issues, {title}: {len(found)}\n")
              for issue in found:
                  where = issue.get("component", "").split(":", 1)[-1]
                  print(
                      f"- **{issue.get('severity')}** `{issue.get('rule')}` "
                      f"{where}:{issue.get('line', '-')} - {issue.get('message')}"
                  )
              if not found:
                  print("None.")
              print()

          status, body = read("gate")
          state = body.get("projectStatus", {}).get("status")
          if state is None:
              unreadable(status, "Quality gate")
              # Not a build failure: nothing was judged, and saying so beats
              # both a false green and a red that blames the wrong thing.
              pathlib.Path("gate-verdict").write_text("unknown", encoding="utf-8")
          else:
              print(f"## Quality gate: {state}\n")
              for condition in body["projectStatus"].get("conditions", []):
                  print(
                      f"- {condition.get('status')} `{condition.get('metricKey')}` "
                      f"{condition.get('actualValue')} vs {condition.get('errorThreshold')}"
                  )
              pathlib.Path("gate-verdict").write_text(state, encoding="utf-8")
          PY

          verdict=$(cat gate-verdict 2>/dev/null || echo unknown)
          case "$verdict" in
            ERROR)
              echo "::error title=SonarCloud quality gate::The gate failed; see the summary."
              exit 1
              ;;
            unknown)
              echo "::warning title=SonarCloud quality gate not read::The token cannot" \
                   "read api/qualitygates. Issues are listed above; the gate is not" \
                   "being enforced. A user token would let this fail the build."
              ;;
            *)
              echo "Quality gate: $verdict"
              ;;
          esac

      # Not a failure. The repository is analysable the moment the secrets
      # exist, and until then a red X on every push would train everyone to
      # ignore this workflow.
      - name: Explain the skip
        if: steps.token.outputs.present == 'false'
        env:
          MISSING: ${{ steps.token.outputs.missing }}
        run: |
          echo "::notice title=SonarCloud scan skipped::Missing secret(s):$MISSING." \
               "Add them under Settings > Secrets and variables > Actions." \
               "Coverage is already generated and its paths are verified above."
