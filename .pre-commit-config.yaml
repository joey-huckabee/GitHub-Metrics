default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.1
    hooks:
      - id: isort

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        # No `--fix`. `make lint` and CI run `ruff check .`, which reports;
        # a hook that quietly rewrites the file instead means the two can
        # disagree about whether the tree is clean.
        args: [--no-fix]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: poetry run mypy --config-file mypy.ini
        language: system
        types: [python]
        pass_filenames: false

      # pylint was missing, so the hooks could pass on a tree `make lint`
      # rejects - and `make check` is meant to be exactly what CI runs. Given
      # the three names rather than `.`, because pointing pylint at the
      # directory makes it try to lint the virtualenv.
      - id: pylint
        name: pylint
        entry: poetry run pylint github_metrics tests scripts
        language: system
        types: [python]
        pass_filenames: false
