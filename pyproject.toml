[project]
name = "github-metrics"
version = "0.1.0"
description = "Calculate GitHub Metrics for FOSS Analysis"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<4.0"
authors = [{ name = "Joey Huckabee", email = "joey.huckabee@gmail.com" }]
keywords = ["github", "metrics", "foss", "open-source", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pygithub (>=2.5.0,<3.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "click (>=8.1.7,<9.0.0)",
    "dataclasses-json (>=0.6.7,<0.7.0)",
    "geopy (>=2.4.1,<3.0.0)",
]

[project.urls]
Homepage = "https://github.com/joey-huckabee/GitHub-Metrics"
Repository = "https://github.com/joey-huckabee/GitHub-Metrics"
Issues = "https://github.com/joey-huckabee/GitHub-Metrics/issues"

[project.scripts]
github-metrics = "github_metrics.cli:main"

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{ include = "github_metrics" }]

[tool.poetry.group.dev.dependencies]
black = ">=24.10.0"
isort = ">=5.13.2"
mypy = ">=1.13.0"
pylint = ">=3.3.1"
pre-commit = ">=4.0.1"
pytest-cov = ">=6.0.0"
vulture = ">=2.13"
ruff = ">=0.8.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Formatting
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["github_metrics"]

# ---------------------------------------------------------------------------
# Linting
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# `I` (isort) is intentionally omitted: isort owns import ordering here.
select = ["E", "F", "W", "B", "C4", "UP", "SIM", "RET", "ARG", "PTH", "N", "D"]
ignore = [
    "D107", # missing docstring in __init__
    "D203", # conflicts with D211
    "D213", # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ARG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.vulture]
paths = ["github_metrics", "tests", "scripts"]
exclude = [".venv"]
min_confidence = 80
ignore_names = ["cls"]

# ---------------------------------------------------------------------------
# Testing
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=github_metrics",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "integration: tests that hit the live GitHub API (deselect with '-m \"not integration\"')",
    "requirement(*ids): requirement identifiers this test verifies; harvested by scripts/build-trace-matrix.py",
]

[tool.coverage.run]
source = ["github_metrics"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
