[project]
name = "github-metrics"
version = "0.6.0"
description = "Calculate GitHub Metrics for FOSS Analysis"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<4.0"
authors = [{ name = "Joey Huckabee", email = "joey.huckabee@gmail.com" }]
keywords = ["github", "metrics", "foss", "open-source", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pygithub (>=2.5.0,<3.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "click (>=8.1.7,<9.0.0)",
    "dataclasses-json (>=0.6.7,<0.7.0)",
    "geopy (>=2.4.1,<3.0.0)",
]

[project.urls]
Homepage = "https://github.com/joey-huckabee/GitHub-Metrics"
Repository = "https://github.com/joey-huckabee/GitHub-Metrics"
Issues = "https://github.com/joey-huckabee/GitHub-Metrics/issues"

[project.scripts]
github-metrics = "github_metrics.cli:main"

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{ include = "github_metrics" }]

[tool.poetry.group.dev.dependencies]
black = ">=24.10.0"
isort = ">=5.13.2"
mypy = ">=1.13.0"
pylint = ">=3.3.1"
pre-commit = ">=4.0.1"
pytest-cov = ">=6.0.0"
vulture = ">=2.13"
ruff = ">=0.8.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Formatting
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["github_metrics"]

# ---------------------------------------------------------------------------
# Linting
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# `I` (isort) is intentionally omitted: isort owns import ordering here.
#
# The second row exists to cover the ground SonarCloud's Python rules cover, so
# that a finding surfaces here - on a developer's machine, in seconds - rather
# than on a dashboard after a push. `S` is flake8-bandit (Sonar's security
# hotspots), `C90` is cyclomatic complexity, `PL` the pylint port, `DTZ`
# timezone-naive datetimes, `T20` stray prints, `LOG`/`G` logging misuse.
select = [
    "E", "F", "W", "B", "C4", "UP", "SIM", "RET", "ARG", "PTH", "N", "D",
    "S", "C90", "PL", "PERF", "RUF", "A", "DTZ", "T20", "PIE", "LOG", "G",
]
ignore = [
    "D107",    # missing docstring in __init__
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    # Ambiguous-unicode. The prose in this repository uses en and em dashes
    # deliberately and CLAUDE.md forbids reshaping it to avoid them; these
    # rules would do exactly that, in docstrings and comments where no parser
    # is involved.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# A test asserts; a test needs fixture credentials; a test compares against the
# literal values under test. S101/S105/S106 and PLR2004 are all correct about
# the code and wrong about test code specifically. PLR0913 likewise: a test
# taking several fixtures is a test, not a design problem.
"tests/*" = ["D", "ARG", "S101", "S105", "S106", "PLR2004", "PLR0913", "PLR0917"]
# This module transcribes a supplied function verbatim in order to test what it
# actually did. That function has no return statement, so every assignment in
# it is genuinely unused - which is the defect being demonstrated, not one to
# tidy away. F841 is correct about the code and wrong about the intent, and
# C901 is correct that the original was tangled, which is also the point.
"tests/test_popularity.py" = [
    "D", "ARG", "S101", "S105", "S106", "PLR2004", "PLR0913", "PLR0917", "F841", "C901",
]
# A build script's standard output *is* its interface; there is no logger to
# route it through and nothing downstream parsing a data stream.
"scripts/*" = ["T201"]

[tool.ruff.lint.mccabe]
# Ruff's default is 10. Twelve is where the ingestion reader sits once its
# per-row ladder is extracted, and it is well inside SonarCloud's own default
# cognitive-complexity threshold of 15.
max-complexity = 12

[tool.ruff.lint.pylint]
# SonarCloud's default maximum is 7. Matching it here means a function that
# passes locally passes there, rather than being reported after the fact.
max-args = 7
max-positional-args = 7

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.vulture]
paths = ["github_metrics", "tests", "scripts"]
exclude = [".venv"]
min_confidence = 80
ignore_names = ["cls"]

# ---------------------------------------------------------------------------
# Testing
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "integration: tests that hit the live GitHub API (deselect with '-m \"not integration\"')",
    "requirement(*ids): requirement identifiers this test verifies; harvested by scripts/build-trace-matrix.py",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "scripts/*", ".venv/*"]
branch = true
# Paths in coverage.xml are written relative to the repository root rather than
# to `source`. Without this, coverage.py emits `cli.py` against a <source> of
# `.../github_metrics`, and any consumer that resolves paths from the project
# root - SonarCloud among them - matches nothing and reports 0% coverage
# without erroring. `github_metrics/cli.py` resolves.
relative_files = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
