# SonarQube Cloud (SonarCloud) analysis settings.
#
# The scan runs from .github/workflows/sonarcloud.yml, which needs three
# repository secrets: SONAR_TOKEN, SONAR_ORGANIZATION and SONAR_PROJECT_KEY.
# Without them the workflow skips the scan and says so rather than failing the
# build - a red X on every push would train people to ignore it.
#
# The project key and organization are **deliberately not here.** They are
# passed on the command line from those secrets, so this file carries no value
# that has to be kept in step with an account. A key hard-coded here and
# changed there fails with an authorization error that names neither.

sonar.projectName=GitHub-Metrics

# What is analysed, and what is analysed *as tests*. The split matters: Sonar
# applies a different rule set to test code, and counting tests as production
# source would report their assertions as untested lines.
sonar.sources=github_metrics,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Every interpreter CI runs against. Sonar uses this to decide which syntax and
# which deprecations apply; naming only one would hide a rule that fires on
# another.
sonar.python.version=3.10,3.11,3.12,3.13,3.14

# Written by pytest-cov. The paths inside it are relative to the repository
# root - see `relative_files` and `--cov=.` in pyproject.toml. That is not
# cosmetic: with coverage.py's default the file names come out relative to the
# package directory (`cli.py` rather than `github_metrics/cli.py`), Sonar
# resolves none of them, and the project reports 0% coverage without any error
# to say why.
sonar.python.coverage.reportPaths=coverage.xml

# Generated, and checked by scripts/build-trace-matrix.py rather than by review.
sonar.exclusions=docs/TRACE-MATRIX.md
